name: Traduzir fila
run-name: ${{ (inputs.adm && inputs.adm != 'todas') && format('Tradução — {0}', inputs.adm) || 'Disparar as adms' }}

on:
  schedule:
    - cron: "17 * * * *"    # toda hora, aos 17 min (se já estiver rodando, espera na fila)
  workflow_dispatch:        # botão "Run workflow" para começar na hora
    inputs:
      adm:
        description: "Adm (todas = abre uma execução para cada adm)"
        type: choice
        required: false
        default: todas
        options: [todas, Ana Luiza, Bianca, Francielle, Isabela, Thaís]

permissions:
  contents: write
  actions: write

jobs:
  # A cada hora: abre uma execução separada para cada adm (cada uma com o seu histórico).
  # Pula a adm que já está traduzindo.
  disparar:
    if: ${{ !inputs.adm || inputs.adm == 'todas' }}
    runs-on: ubuntu-latest
    steps:
      - name: Abrir uma execução por adm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for adm in "Ana Luiza" "Bianca" "Francielle" "Isabela" "Thaís"; do
            ativa=""
            for st in queued in_progress pending waiting; do
              gh run list -w traduzir.yml -s "$st" --json displayTitle -q '.[].displayTitle' | grep -qx "Tradução — $adm" && ativa="sim"
            done
            if [ -n "$ativa" ]; then echo "$adm: já está traduzindo."; else gh workflow run traduzir.yml --ref main -f adm="$adm"; echo "$adm: execução aberta."; fi
          done

  traduzir:
    if: ${{ inputs.adm && inputs.adm != 'todas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # A mesma adm nunca roda duas vezes ao mesmo tempo.
    concurrency:
      group: traducao-${{ inputs.adm }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Traduzir
        id: traduzir
        run: node traduzir.js
        env:
          PONTE_URL: ${{ secrets.PONTE_URL }}
          PONTE_TOKEN: ${{ secrets.PONTE_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANA_LUIZA: ${{ secrets.ANA_LUIZA }}
          BIANCA: ${{ secrets.BIANCA }}
          FRANCIELLE: ${{ secrets.FRANCIELLE }}
          THAIS: ${{ secrets.THAIS }}
          ADM: ${{ inputs.adm }}

      # Registra a execução no repositório. Sem atividade por 60 dias,
      # o GitHub desliga o agendamento de repositórios públicos.
      - name: Registrar execução
        if: always()
        run: |
          date -u > ultima-execucao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add ultima-execucao.txt custos 2>/dev/null || git add ultima-execucao.txt
          git commit -m "Registro de execução" || true
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM % 10 + 5)); done || true

      # Acabou o tempo (5h40) sem problema de crédito: começa a próxima execução na hora.
      - name: Continuar
        if: steps.traduzir.outputs.continuar == 'true'
        run: gh workflow run traduzir.yml --ref main -f adm="${{ inputs.adm }}"
        env:
          GH_TOKEN: ${{ github.token }}
