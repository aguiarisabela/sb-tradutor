name: Traduzir fila

on:
  schedule:
    - cron: "17 * * * *"    # toda hora, aos 17 min (se já estiver rodando, espera na fila)
  workflow_dispatch:        # botão "Run workflow" para começar na hora
    inputs:
      adm:
        description: "Só esta adm (vazio = todas)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  traduzir:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # Uma tradução por adm, todas ao mesmo tempo. Cada uma pega só os livros dela.
    strategy:
      fail-fast: false
      matrix:
        adm: ${{ fromJSON(inputs.adm && format('["{0}"]', inputs.adm) || '["Ana Luiza","Bianca","Franciele","Isabela","Thaís"]') }}
    # A mesma adm nunca roda duas vezes ao mesmo tempo.
    concurrency:
      group: traducao-${{ matrix.adm }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Traduzir
        id: traduzir
        run: node traduzir.js
        env:
          PONTE_URL: ${{ secrets.PONTE_URL }}
          PONTE_TOKEN: ${{ secrets.PONTE_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SEGREDOS: ${{ toJSON(secrets) }}   # chaves das adms (CHAVE_NOME)
          ADM: ${{ matrix.adm }}

      # Registra a execução no repositório. Sem atividade por 60 dias,
      # o GitHub desliga o agendamento de repositórios públicos.
      - name: Registrar execução
        if: always()
        run: |
          date -u > ultima-execucao.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add ultima-execucao.txt
          git commit -m "Registro de execução" || true
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep $((RANDOM % 10 + 5)); done || true

      # Acabou o tempo (5h40) sem problema de crédito: começa a próxima execução na hora.
      - name: Continuar
        if: steps.traduzir.outputs.continuar == 'true'
        run: gh workflow run traduzir.yml --ref main -f adm="${{ matrix.adm }}"
        env:
          GH_TOKEN: ${{ github.token }}
